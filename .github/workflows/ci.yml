name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            simple_api/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install mock API dependencies
        run: npm ci --prefix simple_api

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run production build
        run: npm run build

      - name: Smoke test dev workflow
        run: node scripts/smoke-dev-all.mjs
